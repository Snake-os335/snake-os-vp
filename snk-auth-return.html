<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Sesión iniciada · Snake OS</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#0b3d22;color:#eafff0;text-align:center}a{color:#7CFC9A}</style></head>
<body><div><div style="font-size:42px">🐍</div><p>Sesión iniciada. Volviendo a Snake OS…</p><p><a id="back" href="/">Volver a Snake OS</a></p></div>
<script>
/* Página de vuelta tras iniciar sesión desde el Navegador de Snake OS.
   Avisa a la ventana de Snake OS (mismo origen) y se cierra sola. Sin ventana de origen (móvil): vuelve a Snake OS. */
(function () {
  var p = new URLSearchParams(location.search), r = p.get('r') || '';
  if (!/^https:\/\//i.test(r)) r = '';
  try { localStorage.setItem('snkAuthReturn', JSON.stringify({ url: r, at: Date.now() })); } catch (e) {}
  var op = null; try { op = window.opener && !window.opener.closed ? window.opener : null; } catch (e) {}
  if (op) {
    try { op.postMessage({ type: 'snk-google-auth-done', url: r }, location.origin); } catch (e) {}
    setTimeout(function () { window.close(); }, 150);
    setTimeout(function () { if (!window.closed) location.replace('/'); }, 1500);
  } else {
    location.replace('/');
  }
})();
</script></body></html>
