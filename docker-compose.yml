services:
  web:
    build: .
    container_name: snake-os-vp
    restart: unless-stopped
    # Logs con tope: el driver json-file crece sin límite y puede llenar el disco del VPS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8988:8000"
    volumes:
      - .:/app
      - /home/david/juegos-david/usuarios_snake/snake-os-vp_snakeos-vp-data:/app/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/os-release:ro
      - /etc/hostname:/host/hostname:ro
      - ${SNAKEOS_PIPER_VOICES:-../piper-voices}:/voices:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=1
      - ORT_NUM_THREADS=1
      - SNAKEOS_PIPER_DIR=/voices
      - SNAKEOS_TTS_REMOTE_URL=${SNAKEOS_TTS_REMOTE_URL:-}
      - SNAKEOS_TTS_KEY=${SNAKEOS_TTS_KEY:-}
      - OS_GATE_PASSWORD=${OS_GATE_PASSWORD:-}
      - SNAKEOS_LAN_IP=${SNAKEOS_LAN_IP:-}
      - SNAKEOS_LAN_PORT=${SNAKEOS_LAN_PORT:-8988}
      - SNAKEOS_PVE_SSH_HOST=${SNAKEOS_PVE_SSH_HOST:-}
      - SNAKEOS_PVE_SSH_USER=${SNAKEOS_PVE_SSH_USER:-}
      - SNAKEOS_PVE_SSH_KEY=/run/secrets/pve_ssh_key
      - SNAKEOS_UBUNTU_SSH_HOST=${SNAKEOS_UBUNTU_SSH_HOST:-}
      - SNAKEOS_UBUNTU_SSH_USER=${SNAKEOS_UBUNTU_SSH_USER:-}
      - SNAKEOS_UBUNTU_SSH_KEY=/run/secrets/ubuntu_ssh_key
      - SNAKEOS_ASKBOX_BASE_URL=${SNAKEOS_ASKBOX_BASE_URL:-https://askbox.softportweb.com/api}
      - SNAKEOS_ASKBOX_KEY=${SNAKEOS_ASKBOX_KEY:-}
      - SNAKEOS_VAPID_PUBLIC=${SNAKEOS_VAPID_PUBLIC:-}
      - SNAKEOS_VAPID_PRIVATE_B64=${SNAKEOS_VAPID_PRIVATE_B64:-}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: snake-os-vp-cloudflared
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web

