<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snake OS VP Pro · suscripción gratuita</title>
<meta name="description" content="Snake OS VP Pro: más de 20 funciones nuevas para tu perfil de Snake OS VP. Gratis con tu cuenta Dogaemail.">
<meta name="theme-color" content="#0b0a03">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='17' fill='%230a2414'/%3E%3Cpath d='M15 46c0-9 7-11 16-11s16-3 16-10-6-10-12-10c-5 0-8 2-10 5' fill='none' stroke='%234ade80' stroke-width='7.2' stroke-linecap='round'/%3E%3Cellipse cx='24.5' cy='20.5' rx='6.4' ry='5.2' fill='%234ade80'/%3E%3Crect x='32' y='44.5' width='26' height='12' rx='6' fill='%23f5c542'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/snake-fonts.css?v=202610211900">
<style>
  :root{--g:#22c55e;--g2:#4ade80;--au:#f5c542;--au2:#ffe48a;--bg:#050805;--fg:#f4fbf6;--mut:rgba(244,251,246,.72);--glass:rgba(16,26,18,.6);--gb:rgba(245,197,66,.22)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--snake-font,Inter,system-ui,sans-serif)}
  body{background:radial-gradient(1100px 650px at 12% -10%,#3a2c06 0,transparent 60%),radial-gradient(900px 600px at 110% 15%,#064e3b 0,transparent 55%),radial-gradient(800px 500px at 50% 120%,#14532d 0,transparent 60%),var(--bg);background-attachment:fixed}
  a{color:var(--g2)}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 48px}
  header{display:flex;align-items:center;gap:12px}
  header svg{width:40px;height:40px}
  header b{font:800 19px/1 var(--snake-font-display,Outfit,sans-serif)}
  .badge{display:inline-block;padding:2px 8px;border-radius:7px;font:800 12px/1.5 system-ui,sans-serif;letter-spacing:.06em;color:#2a1c00;background:linear-gradient(135deg,var(--au2),var(--au) 55%,#c9931a);vertical-align:2px}
  header .sp{flex:1}
  .lang{display:flex;gap:4px;background:var(--glass);border:1px solid var(--gb);border-radius:12px;padding:3px}
  .lang button{border:0;background:none;color:var(--fg);font:600 13px var(--snake-font,Inter,sans-serif);padding:6px 10px;border-radius:9px;cursor:pointer}
  .lang button.on{background:var(--au);color:#2a1c00}
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start;margin-top:34px}
  h1{font:800 clamp(34px,5.4vw,60px)/1.04 var(--snake-font-display,Outfit,sans-serif);margin:0 0 14px;letter-spacing:-.5px}
  h1 em{font-style:normal;background:linear-gradient(135deg,var(--au2),var(--au));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{font-size:17px;line-height:1.55;color:var(--mut);margin:0 0 18px;max-width:56ch}
  .steps{display:flex;flex-direction:column;gap:8px;margin:0 0 18px;padding:0;list-style:none}
  .steps li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45}
  .steps li b{flex:0 0 26px;height:26px;border-radius:50%;background:rgba(245,197,66,.18);border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--au2)}
  .card{background:var(--glass);border:1px solid var(--gb);border-radius:22px;padding:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .card h2{margin:0 0 12px;font:800 20px var(--snake-font-display,Outfit,sans-serif)}
  .cta{display:block;width:100%;border:0;border-radius:16px;padding:16px 20px;font:800 17px var(--snake-font-display,Outfit,sans-serif);cursor:pointer;color:#2a1c00;background:linear-gradient(135deg,var(--au2),var(--au) 55%,#d8a223);box-shadow:0 12px 30px rgba(245,197,66,.25);margin-top:14px}
  .cta:disabled{opacity:.55;cursor:not-allowed}
  .code{margin-top:14px;padding:16px;border-radius:16px;border:1px dashed rgba(245,197,66,.6);background:rgba(0,0,0,.35);text-align:center;display:none}
  .code.on{display:block}
  .code .v{font:800 clamp(17px,2.5vw,24px) ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.03em;white-space:nowrap;overflow-x:auto;color:var(--au2);word-break:break-all;user-select:all}
  .code .v.dots{color:var(--mut);user-select:none}
  .code .t{margin-top:8px;font-size:14px;color:var(--mut)}
  .code .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
  .code .bar i{display:block;height:100%;background:var(--au);width:100%;transition:width 1s linear}
  .code button{margin-top:10px;border:1px solid var(--gb);background:rgba(245,197,66,.14);color:var(--fg);border-radius:10px;padding:8px 14px;font:700 14px inherit;cursor:pointer}
  .msg{min-height:1.3em;margin-top:10px;font-size:14px;font-weight:700}
  .msg.err{color:#ff8a7a}.msg.ok{color:var(--g2)}
  .note{font-size:13px;color:var(--mut);line-height:1.5;margin:12px 0 0}
  .feats{margin-top:44px}
  .feats h2{font:800 28px var(--snake-font-display,Outfit,sans-serif);margin:0 0 6px}
  .feats p{color:var(--mut);margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .f{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--glass);border:1px solid rgba(255,255,255,.08)}
  .f i{font-style:normal;font-size:22px;flex:0 0 30px;text-align:center}
  .f b{display:block;font-size:15px;margin-bottom:3px}
  .f span{font-size:13px;color:var(--mut);line-height:1.4}
  footer{margin-top:40px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
  @media (max-width:820px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="17" fill="#0a2414"/><path d="M15 46c0-9 7-11 16-11s16-3 16-10-6-10-12-10c-5 0-8 2-10 5" fill="none" stroke="#4ade80" stroke-width="7.2" stroke-linecap="round"/><ellipse cx="24.5" cy="20.5" rx="6.4" ry="5.2" fill="#4ade80"/><rect x="32" y="44.5" width="26" height="12" rx="6" fill="#f5c542"/></svg>
    <b translate="no">Snake OS VP <span class="badge">PRO</span></b>
    <span class="sp"></span>
    <div class="lang"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div>
  </header>
  <section class="hero">
    <div>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <ol class="steps">
        <li><b>1</b><span data-t="s1"></span></li>
        <li><b>2</b><span data-t="s2"></span></li>
        <li><b>3</b><span data-t="s3"></span></li>
      </ol>
      <p class="note" data-t="free"></p>
    </div>
    <div class="card" id="box">
      <h2 data-t="acc"></h2>
      <div id="auth"></div>
      <button type="button" class="cta" id="cta" disabled></button>
      <div class="code" id="code" aria-live="polite">
        <div class="v" id="codeV" data-noi18n translate="no"></div>
        <div class="t" id="codeT"></div>
        <div class="bar"><i id="codeBar"></i></div>
        <button type="button" id="copy"></button>
      </div>
      <div class="msg" id="msg" role="status"></div>
      <p class="note" data-t="how"></p>
    </div>
  </section>
  <section class="feats">
    <h2 data-t="fh"></h2>
    <p data-t="fp"></p>
    <div class="grid" id="grid"></div>
  </section>
  <footer><span data-t="foot"></span><a href="/" id="openOS" data-t="open"></a></footer>
</div>
<script src="/static/snake-pro-features.js?v=202610212015"></script>
<script src="/static/doga-auth.js?v=202610220400"></script>
<script src="/static/snake-emoji-data.js?v=202610100831"></script>
<script src="/static/snake-emoji.js?v=202610140900"></script>
<script>
(function(){
  'use strict';
  var TX = {
    es: { h1: 'Snake OS VP <em>Pro</em>, gratis.', lead: 'Más de 20 funciones nuevas para tu perfil de Snake OS VP: fondos animados, colores y temas Pro, widgets, Kanban, grabador de pantalla, diseños de ventanas, salvapantallas, estilos de terminal e instantáneas en Máquinas virtuales. Todo lo que ya tienes en Snake OS sigue igual y gratis.',
      s1: 'Entra con tu cuenta Dogaemail de Snake OS VP (o crea una aquí).', s2: 'Pulsa «Abrir suscripción gratuita» y copia tu código. Solo se ve una vez, durante 60 segundos.', s3: 'Vuelve a tu pestaña de Snake OS VP, abre Ajustes › Snake OS VP Pro, pega el código y listo.',
      free: 'Sin pagos ni tarjetas. El código queda ligado a tu cuenta, sirve una sola vez y caduca a los 30 días si no lo usas.',
      acc: 'Tu cuenta', cta: 'Abrir suscripción gratuita', ctaWait: 'Generando…', ctaNeed: 'Inicia sesión para abrir la suscripción', ctaPro: 'Tu cuenta ya tiene Pro ✅', ctaAgain: 'Pedir un código nuevo',
      left: function (s) { return 'Cópialo ahora: desaparece en ' + s + ' s y no se vuelve a mostrar.'; }, gone: 'El código ya no se muestra. Si lo copiaste, pégalo en tu pestaña de Snake OS VP › Ajustes › Snake OS VP Pro. Si no, pide otro.', busy: 'Snake OS VP ya está abierto en otra pestaña de este navegador. Vuelve a esa pestaña y pega el código allí: abrirlo aquí cerraría esa sesión.', anyway: 'Abrir aquí de todas formas',
      pend: function (n) { return 'Ya pediste ' + (n === 1 ? 'un código' : n + ' códigos') + ' sin usar. Por seguridad no se vuelven a mostrar.'; },
      copy: 'Copiar código', copied: 'Código copiado ✅', how: 'El servidor solo guarda una huella cifrada del código, nunca el código.',
      active: 'Snake OS VP Pro ya está activo en esta cuenta. Ábrelo en Snake OS VP: botón ⭐ de la barra de tareas.',
      fh: 'Qué incluye Pro', fp: 'Funciones nuevas solo para perfiles con Pro. Ninguna función que ya existía se bloquea.', foot: 'Snake OS VP · la máquina virtual (Linux con escritorio estilo Ubuntu 26.10) sigue en la app Máquinas virtuales.', open: 'Abrir Snake OS VP →' },
    en: { h1: 'Snake OS VP <em>Pro</em>, free.', lead: 'More than 20 new features for your Snake OS VP profile: animated wallpapers, Pro colours and themes, widgets, Kanban, screen recorder, window layouts, screensavers, terminal styles and snapshots in Virtual machines. Everything you already have in Snake OS stays the same and free.',
      s1: 'Sign in with your Snake OS VP Dogaemail account (or create one here).', s2: 'Press “Open free subscription” and copy your code. It is shown only once, for 60 seconds.', s3: 'Go back to your Snake OS VP tab, open Settings › Snake OS VP Pro, paste the code and you are done.',
      free: 'No payments, no cards. The code is bound to your account, works once and expires after 30 days if unused.',
      acc: 'Your account', cta: 'Open free subscription', ctaWait: 'Generating…', ctaNeed: 'Sign in to open the subscription', ctaPro: 'Your account already has Pro ✅', ctaAgain: 'Get a new code',
      left: function (s) { return 'Copy it now: it disappears in ' + s + ' s and is never shown again.'; }, gone: 'The code is no longer shown. If you copied it, paste it in your Snake OS VP tab › Settings › Snake OS VP Pro. If not, get another one.', busy: 'Snake OS VP is already open in another tab of this browser. Go back to that tab and paste the code there: opening it here would close that session.', anyway: 'Open it here anyway',
      pend: function (n) { return 'You already requested ' + (n === 1 ? 'a code' : n + ' codes') + ' not used yet. For security they are never shown again.'; },
      copy: 'Copy code', copied: 'Code copied ✅', how: 'The server only stores an encrypted fingerprint of the code, never the code itself.',
      active: 'Snake OS VP Pro is already active on this account. Open it in Snake OS VP: ⭐ button on the taskbar.',
      fh: 'What Pro includes', fp: 'New features only for profiles with Pro. No existing feature gets locked.', foot: 'Snake OS VP · the virtual machine (Linux with an Ubuntu 26.10-style desktop) stays in the Virtual machines app.', open: 'Open Snake OS VP →' }
  };
  var lang = 'es';
  try { lang = localStorage.getItem('snkProLang') || ((navigator.language || '').slice(0, 2) === 'en' ? 'en' : 'es'); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var auth = window.DogaAuth.create('pro');
  var st = { user: null, mine: null, shown: false, timer: null, busy: false };
  function t(k) { return TX[lang][k]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function msg(text, kind) { var m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function paintText() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { var v = t(el.dataset.t); if (typeof v === 'string') { if (el.dataset.t === 'h1') el.innerHTML = v; else el.textContent = v; } });
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === lang); });
    $('copy').textContent = t('copy');
    $('grid').innerHTML = (window.SNK_PRO_FEATURES || []).map(function (f) { var x = f[lang] || f.es; return '<div class="f"><i>' + f.ico + '</i><div><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div></div>'; }).join('');
    paintCta();
    if (auth.repaint) auth.repaint();
  }
  function paintCta() {
    var c = $('cta');
    if (st.busy) { c.disabled = true; c.textContent = t('ctaWait'); return; }
    if (!st.user) { c.disabled = true; c.textContent = t('ctaNeed'); return; }
    if (st.mine && st.mine.active) { c.disabled = true; c.textContent = t('ctaPro'); return; }
    c.disabled = false; c.textContent = st.mine && st.mine.pending_codes ? t('ctaAgain') : t('cta');
  }
  function dots() {
    clearInterval(st.timer); st.timer = null;
    var v = $('codeV'); v.textContent = '••••••-••••-••••-••••'; v.classList.add('dots');
    $('codeT').textContent = t('gone'); $('codeBar').style.width = '0%'; $('copy').style.display = 'none';
    $('code').classList.add('on');
  }
  function refreshMine() {
    if (!st.user) { st.mine = null; paintCta(); return Promise.resolve(); }
    return auth.fetch('/api/pro/mine').then(function (d) {
      st.mine = d; paintCta();
      if (d.active) { msg(t('active'), 'ok'); $('code').classList.remove('on'); }
      else if (d.pending_codes && !st.timer) { msg(t('pend')(d.pending_codes), ''); dots(); }
      else if (!st.timer) msg('', '');
    }, function () { st.mine = null; paintCta(); });
  }
  function show(code, secs) {
    var v = $('codeV'), end = Date.now() + secs * 1000;
    v.classList.remove('dots'); v.textContent = code; code = null; // no queda en ninguna variable
    $('copy').style.display = ''; $('code').classList.add('on'); $('codeBar').style.width = '100%';
    function tick() { var left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); $('codeT').textContent = t('left')(left); $('codeBar').style.width = (left / secs * 100) + '%'; if (left <= 0) { dots(); refreshMine(); } }
    tick(); st.timer = setInterval(tick, 1000);
  }
  $('cta').onclick = function () {
    if (!st.user || st.busy) return;
    st.busy = true; paintCta(); msg('', '');
    auth.fetch('/api/pro/code', { method: 'POST' }).then(function (d) { st.busy = false; paintCta(); show(d.code, d.show_seconds || 60); d.code = null; },
      function (e) { st.busy = false; paintCta(); msg((e && e.message) || 'Error', 'err'); if (e && e.status === 401) { auth.me().then(function (u) { st.user = u; if (auth.repaint) auth.repaint(); paintCta(); }); } });
  };
  $('copy').onclick = function () {
    var v = $('codeV'); if (v.classList.contains('dots')) return;
    var txt = v.textContent;
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { msg(t('copied'), 'ok'); }, function () { var r = document.createRange(); r.selectNodeContents(v); var s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); msg(t('copied'), 'ok'); } catch (e) {} });
  };
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.dataset.l; try { localStorage.setItem('snkProLang', lang); } catch (e) {} paintText(); }; });
  auth.mount($('auth'), { lang: function () { return lang; }, onChange: function (u) {
    var changed = (u && u.email) !== (st.user && st.user.email); st.user = u;
    if (changed) { clearInterval(st.timer); st.timer = null; $('code').classList.remove('on'); $('codeV').textContent = ''; msg('', ''); }
    refreshMine();
  } });
  /* No volver a abrir Snake OS si ya está abierto con sesión en otra pestaña: cargar «/» cierra esa sesión */
  var osTabs = 0, bcs = null;
  try { bcs = new BroadcastChannel('snakeos-session'); bcs.onmessage = function (e) { var d = e.data || {}; if (d.t === 'here' && d.signed) osTabs++; }; } catch (e) {}
  $('openOS').onclick = function (ev) {
    if (!bcs || $('openOS').dataset.go) return;
    ev.preventDefault(); osTabs = 0;
    try { bcs.postMessage({ t: 'ping', from: 'pro' }); } catch (e) { location.href = '/'; return; }
    setTimeout(function () {
      if (!osTabs) { location.href = '/'; return; }
      msg(t('busy'), 'err'); var a = $('openOS'); a.dataset.go = '1'; a.textContent = t('anyway');
    }, 350);
  };
  paintText();
})();
</script>
</body>
</html>
